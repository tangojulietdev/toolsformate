                                        </div>
                                        <div className="card">
                                            <label className="input-label">FW Consumption (T/day)</label>
                                            <input type="number" className="input-field" value={fwConsumption} onChange={(e) => setFwConsumption(parseFloat(e.target.value))} />
                                        </div>
                                        <div className="card">
                                            <label className="input-label">FW Generation at Sea (T/day)</label>
                                            <input type="number" className="input-field" value={fwGeneration} onChange={(e) => setFwGeneration(parseFloat(e.target.value))} />
                                        </div>
                                    </div>

                                    <h2 className="section-title" style={{marginTop: '32px'}}>ROB Calculator</h2>
                                    
                                    <div className="grid-3 no-print rob-top" style={{gridTemplateColumns: 'repeat(2, 1fr)', marginBottom: '24px'}}>
                                        <div className="card">
                                            <label className="input-label">Starting Fuel ROB at first departure (tons)</label>
                                            <input type="number" className="input-field" value={startingFuelROB} onChange={(e) => setStartingFuelROB(parseFloat(e.target.value))} />
                                        </div>
                                        <div className="card">
                                            <label className="input-label">Starting FW ROB at first departure (tons)</label>
                                            <input type="number" className="input-field" value={startingFWROB} onChange={(e) => setStartingFWROB(parseFloat(e.target.value))} />
                                        </div>
                                    </div>

                                    <div className="toolbar no-print">
                                        <div className="seg" role="group" aria-label="ROB view">
                                            <button type="button" aria-pressed={robView === 'cards'} onClick={() => setRobView('cards')}>Leg cards</button>
                                            <button type="button" aria-pressed={robView === 'summary'} onClick={() => setRobView('summary')}>All results</button>
                                        </div>
                                        <button type="button" className="btn-ghost" onClick={() => { setRobView('summary'); setTimeout(() => window.print(), 150); }}>Print / Save PDF</button>
                                    </div>

                                    <div className="print-only print-head">
                                        <h1>ROB Forecast</h1>
                                        <div>Printed {fmtDay(nowMs)} {fmtClock(nowMs)} UTC. Starting ROB at first departure: fuel {startingFuelROB} T, FW {startingFWROB} T.</div>
                                        <div>Speed profiles: {[superEco, eco, full].map(p => p.name + ' ' + p.speed + ' kts / ' + p.fuel + ' T/day').join('; ')}. Port fuel {portFuel || 0} T/day. FW consumption {fwConsumption} T/day.</div>
                                    </div>

                                    {robView === 'cards' && (
                                    <div className="legs no-print">
                                        {robRows.map((row, idx) => {
                                            const r = robResults[idx] || {};
                                            const neg = (v) => parseFloat(v) < 0 ? { color: 'var(--bad)' } : undefined;
                                            const upd = (k, v) => { const n = [...robRows]; n[idx] = { ...n[idx], [k]: v }; setRobRows(n); };
                                            return (
                                                <div key={idx} className="card leg-card compact">
                                                    <div className="leg-head">
                                                        <div className="leg-title">Leg {idx + 1}<span>{(row.fromPort || '?') + ' to ' + (row.toPort || '?')}</span></div>
                                                        <div className="leg-meta">{r.seaDays || '0.0'} sea days &middot; {r.fuelUsed || '0.0'} T sea fuel &middot; {r.portFuel || '0.0'} T port fuel &middot; FW net <b style={neg(r.fwNet)}>{r.fwNet || '0.0'}</b> T</div>
                                                    </div>
                                                    <div className="leg-fields">
                                                        <div><label className="input-label">From</label><input type="text" className="input-field" value={row.fromPort} onChange={(e) => upd('fromPort', e.target.value)} /></div>
                                                        <div><label className="input-label">To</label><input type="text" className="input-field" value={row.toPort} onChange={(e) => upd('toPort', e.target.value)} /></div>
                                                        <div><label className="input-label">Dist (NM)</label><input type="number" inputMode="decimal" className="input-field" value={row.distance} onChange={(e) => upd('distance', e.target.value)} /></div>
                                                        <div><label className="input-label">Days in port</label><input type="number" inputMode="decimal" className="input-field" value={row.daysInPort} onChange={(e) => upd('daysInPort', e.target.value)} /></div>
                                                        <div>
                                                            <label className="input-label">Mode</label>
                                                            <div className="mode-btns">
                                                                {['S', 'E', 'F'].map(mode => (
                                                                    <button key={mode} type="button" className={`mode-btn ${row.mode === mode ? 'active' : ''}`} aria-pressed={row.mode === mode} onClick={() => upd('mode', mode)}>{mode}</button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                        <div><label className="input-label">FW gen (T/d)</label><input type="number" inputMode="decimal" className="input-field" value={row.fwGen} onChange={(e) => upd('fwGen', parseFloat(e.target.value))} /></div>
                                                        <div><label className="input-label">Bunker at To (T)</label><input type="number" inputMode="decimal" className="input-field" placeholder="0" value={row.bunker} onChange={(e) => upd('bunker', e.target.value)} /></div>
                                                    </div>
                                                    <div className="leg-results">
                                                        <div className="res-panel">
                                                            <span className="res-title">Arrival {row.toPort || ''}</span>
                                                            <span className="res-item"><span className="res-label">Fuel</span><span className="res-val" style={neg(r.arrFuel)}>{r.arrFuel || '0.0'}</span></span>
                                                            <span className="res-item"><span className="res-label">FW</span><span className="res-val" style={neg(r.arrFW)}>{r.arrFW || '0.0'}</span></span>
                                                        </div>
                                                        <div className="res-panel dep">
                                                            <span className="res-title">Departure {row.toPort || ''}</span>
                                                            <span className="res-item"><span className="res-label">Fuel</span><span className="res-val" style={neg(r.depFuel)}>{r.depFuel || '0.0'}</span></span>
                                                            <span className="res-item"><span className="res-label">FW</span><span className="res-val" style={neg(r.depFW)}>{r.depFW || '0.0'}</span></span>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    )}

                                    {robView === 'summary' && (() => {
                                        const num = (v) => parseFloat(v) || 0;
                                        const tot = robRows.reduce((a, row, i) => { const r = robResults[i] || {}; return { dist: a.dist + num(row.distance), sea: a.sea + num(r.seaDays), fuel: a.fuel + num(r.fuelUsed) + num(r.portFuel), bunker: a.bunker + num(row.bunker) }; }, { dist: 0, sea: 0, fuel: 0, bunker: 0 });
                                        const last = robResults[robResults.length - 1] || {};
                                        const neg = (v) => parseFloat(v) < 0 ? { color: 'var(--bad)' } : undefined;
                                        return (
                                            <div className="sum-wrap">
                                                <table className="sum-table">
                                                    <thead>
                                                        <tr>
                                                            <th>Leg</th><th>From</th><th>To</th><th className="r">Dist NM</th><th className="r">Port days</th><th>Mode</th><th className="r">Sea days</th><th className="r">Sea fuel</th><th className="r">Port fuel</th><th className="r">Bunker</th><th className="r">FW net</th><th className="r grp">Arr fuel</th><th className="r">Arr FW</th><th className="r grp">Dep fuel</th><th className="r">Dep FW</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {robRows.map((row, i) => { const r = robResults[i] || {}; return (
                                                            <tr key={i}>
                                                                <td>{i + 1}</td><td>{row.fromPort || '-'}</td><td>{row.toPort || '-'}</td>
                                                                <td className="r">{row.distance || '0'}</td><td className="r">{row.daysInPort || '0'}</td><td>{row.mode}</td>
                                                                <td className="r">{r.seaDays}</td><td className="r">{r.fuelUsed}</td><td className="r">{r.portFuel}</td><td className="r">{row.bunker || '0'}</td>
                                                                <td className="r" style={neg(r.fwNet)}>{r.fwNet}</td>
                                                                <td className="r grp" style={neg(r.arrFuel)}><b>{r.arrFuel}</b></td><td className="r" style={neg(r.arrFW)}>{r.arrFW}</td>
                                                                <td className="r grp" style={neg(r.depFuel)}><b>{r.depFuel}</b></td><td className="r" style={neg(r.depFW)}>{r.depFW}</td>
                                                            </tr>); })}
                                                    </tbody>
                                                    <tfoot>
                                                        <tr>
                                                            <td colSpan="3">Total</td><td className="r">{tot.dist.toFixed(0)}</td><td></td><td></td>
                                                            <td className="r">{tot.sea.toFixed(1)}</td><td className="r" colSpan="2">{tot.fuel.toFixed(1)} fuel used</td><td className="r">{tot.bunker.toFixed(1)}</td><td></td>
                                                            <td className="r grp"></td><td></td><td className="r grp"><b>{last.depFuel}</b></td><td className="r"><b>{last.depFW}</b></td>
                                                        </tr>
                                                    </tfoot>
                                                </table>
                                            </div>
                                        );
                                    })()}

                                    <button className="btn btn-primary no-print" onClick={() => setRobRows([...robRows, { fromPort: '', toPort: '', distance: '', daysInPort: '', mode: 'E', fwGen: fwGeneration, bunker: '' }])}>+ Add Row</button>
                                    {robRows.length > 1 && (<button className="btn btn-danger no-print" onClick={() => setRobRows(robRows.slice(0, -1))}>− Remove</button>)}
                                </div>
                            )}

                            {activeTab === 1 && (
                                <div>
                                    <h2 className="section-title">ETA Calculator</h2>
                                    <div className="time-note">
                                        <strong>All times are local.</strong> Departure time is the local clock time at the departure port. Each ETA is the local clock time at the arrival port. Set the correct GMT offset for both ports and the calculator converts between them.
                                    </div>
                                    <div className="now-bar">
                                        <span><b>Now, UTC:</b> {fmtDay(nowMs)} {fmtClock(nowMs)}</span>
                                        <span><b>Now, this device:</b> {fmtDay(nowMs - new Date().getTimezoneOffset() * 60000)} {fmtClock(nowMs - new Date().getTimezoneOffset() * 60000)}</span>
                                    </div>
                                    <div className="card eta-speeds">
                                        <div className="card-title">Planning speeds (kts)</div>
                                        <div className="eta-speed-row">
                                            <div><label className="input-label">Speed 1</label><input type="number" inputMode="decimal" className="input-field" value={etaSpeed1} onChange={(e) => setEtaSpeed1(parseFloat(e.target.value))} /></div>
                                            <div><label className="input-label">Speed 2</label><input type="number" inputMode="decimal" className="input-field" value={etaSpeed2} onChange={(e) => setEtaSpeed2(parseFloat(e.target.value))} /></div>
                                            <div><label className="input-label">Speed 3</label><input type="number" inputMode="decimal" className="input-field" value={etaSpeed3} onChange={(e) => setEtaSpeed3(parseFloat(e.target.value))} /></div>
                                        </div>
                                    </div>

                                    <div className="legs">
                                        {etaRows.map((row, idx) => {
                                            const upd = (k, v) => { const n = [...etaRows]; n[idx] = { ...n[idx], [k]: v }; setEtaRows(n); };
                                            const setNow = () => upd('depDateTime', new Date(nowMs + gmtOff(row.depGMT) * 3600000).toISOString().slice(0, 16));
                                            return (
                                                <div key={idx} className="card leg-card">
                                                    <div className="leg-head">
                                                        <div className="leg-title">Leg {idx + 1}<span>{(row.fromPort || '?') + ' to ' + (row.toPort || '?')}</span></div>
                                                        <div className="leg-meta">{row.distance ? row.distance + ' NM' : 'Enter distance'}</div>
                                                    </div>
                                                    <div className="leg-fields">
                                                        <div><label className="input-label">From</label><input type="text" className="input-field" value={row.fromPort} onChange={(e) => upd('fromPort', e.target.value)} /></div>
                                                        <div><label className="input-label">To</label><input type="text" className="input-field" value={row.toPort} onChange={(e) => upd('toPort', e.target.value)} /></div>
                                                        <div><label className="input-label">Distance (NM)</label><input type="number" inputMode="decimal" className="input-field" value={row.distance} onChange={(e) => upd('distance', e.target.value)} /></div>
                                                        <div className="wide">
                                                            <label className="input-label">Departure (local time at {row.fromPort || 'departure port'})</label>
                                                            <div className="inline-field">
                                                                <input type="datetime-local" className="input-field" value={row.depDateTime} onChange={(e) => upd('depDateTime', e.target.value)} />
                                                                <button type="button" className="btn-ghost" onClick={setNow} title="Fill with the current time in the departure zone">Now</button>
                                                            </div>
                                                        </div>
                                                        <div>
                                                            <label className="input-label">Departure zone</label>
                                                            <select className="input-field tz-select" value={row.depGMT} onChange={(e) => upd('depGMT', e.target.value)}>
                                                                {timezones.map(tz => <option key={tz} value={tz}>{TZ_LABEL(tz)}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="input-label">Arrival zone</label>
                                                            <select className="input-field tz-select" value={row.arrGMT} onChange={(e) => upd('arrGMT', e.target.value)}>
                                                                {timezones.map(tz => <option key={tz} value={tz}>{TZ_LABEL(tz)}</option>)}
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <div className="eta-grid">
                                                        {[etaSpeed1, etaSpeed2, etaSpeed3].map((sp, k) => {
                                                            const info = etaInfo(row.depDateTime, row.depGMT, row.distance, sp, row.arrGMT);
                                                            return (
                                                                <div key={k} className="eta-tile">
                                                                    <div className="eta-speed">ETA at {sp} kts</div>
                                                                    {info ? (
                                                                        <>
                                                                            <div className="eta-time"><span className="d">{fmtDMY(info.arrMs)}</span><span className="t">{fmtClock(info.arrMs)}</span><span className="lt">LT</span></div>
                                                                            <div className="eta-sub">Local time at {row.toPort || 'arrival port'} ({TZ_LABEL(row.arrGMT)})</div>
                                                                            <div className="eta-sub">Passage {durText(info.hours)}</div>
                                                                        </>
                                                                    ) : (<div className="eta-empty">Enter distance and departure time</div>)}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <button className="btn btn-primary" onClick={() => setEtaRows([...etaRows, { fromPort: '', toPort: '', distance: '', depDateTime: '', depGMT: 'GMT+0:00', arrGMT: 'GMT+0:00' }])}>+ Add Row</button>
                                    {etaRows.length > 1 && (<button className="btn btn-danger" onClick={() => setEtaRows(etaRows.slice(0, -1))}>− Remove</button>)}
                                </div>
                            )}

                            {activeTab === 2 && (
                                <div>
                                    <h2 className="section-title">Required Speed Calculator</h2>
                                    <div className="spd-cols">
                                        <div className="card dwt-card">
                                            <div className="card-title">Passage</div>
                                            <div className="spd-fields">
                                                <div><label className="input-label">Destination</label>
                                                    <input type="text" className="input-field" value={reqSpeed.destination} onChange={(e) => setReqSpeed({...reqSpeed, destination: e.target.value})} /></div>
                                                <div><label className="input-label">Distance to go (NM)</label>
                                                    <input type="number" inputMode="decimal" className="input-field" value={reqSpeed.dtg} onChange={(e) => setReqSpeed({...reqSpeed, dtg: e.target.value})} /></div>
                                                <div><label className="input-label">Current date / time (local)</label>
                                                    <input type="datetime-local" className="input-field" value={reqSpeed.currentDateTime} onChange={(e) => setReqSpeed({...reqSpeed, currentDateTime: e.target.value})} /></div>
                                                <div><label className="input-label">Current zone</label>
                                                    <select className="input-field tz-select" value={reqSpeed.currentGMT} onChange={(e) => setReqSpeed({...reqSpeed, currentGMT: e.target.value})}>
                                                        {timezones.map(tz => <option key={tz} value={tz}>{TZ_LABEL(tz)}</option>)}
                                                    </select></div>
                                                <div><label className="input-label">Desired ETA (local at destination)</label>
                                                    <input type="datetime-local" className="input-field" value={reqSpeed.desiredETA} onChange={(e) => setReqSpeed({...reqSpeed, desiredETA: e.target.value})} /></div>
                                                <div><label className="input-label">ETA zone</label>
                                                    <select className="input-field tz-select" value={reqSpeed.desiredGMT} onChange={(e) => setReqSpeed({...reqSpeed, desiredGMT: e.target.value})}>
                                                        {timezones.map(tz => <option key={tz} value={tz}>{TZ_LABEL(tz)}</option>)}
                                                    </select></div>
                                            </div>
                                        </div>
                                        <div className="card dwt-card spd-result">
                                            <div className="dwt-label">Required speed</div>
                                            <div className="spd-value">{requiredSpeedValue || '-'}<span> kn</span></div>
                                            <div className="eta-sub">Speed needed to reach {reqSpeed.destination || 'the destination'} by the desired ETA. Both times are local clock times at their own zone.</div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 3 && (
                                <div>
                                    <h2 className="section-title">Cargo Hold Ventilation</h2>
                                    
                                    <div className="grid-3" style={{gridTemplateColumns: 'repeat(4, 1fr)', marginBottom: '24px'}}>
                                        <div className="card">
                                            <label className="input-label">Outside Dry Bulb (°C)</label>
                                            <input type="number" step="0.1" className="input-field" value={outsideAir.dryBulb} onChange={(e) => setOutsideAir({...outsideAir, dryBulb: e.target.value})} />
                                        </div>
                                        <div className="card">
                                            <label className="input-label">Outside Wet Bulb (°C)</label>
                                            <input type="number" step="0.1" className="input-field" value={outsideAir.wetBulb} onChange={(e) => setOutsideAir({...outsideAir, wetBulb: e.target.value})} />
                                        </div>
                                        <div className="card">
                                            <div className="card-title">Outside Dew Point</div>
                                            <div style={{fontSize: '24px', fontWeight: '800', marginTop: '8px'}}>
                                                <span className="auto-value">{outsideDP !== null ? outsideDP.toFixed(1) : '-'} °C</span>
                                            </div>
                                        </div>
                                        <div className="card">
                                            <div className="card-title">Outside RH</div>
                                            <div style={{fontSize: '24px', fontWeight: '800', marginTop: '8px'}}>
                                                <span className="auto-value">{outsideRH !== null ? outsideRH.toFixed(1) : '-'} %</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="summary-grid">
                                        <div className="summary-card">
                                            <div className="summary-value" style={{color: 'var(--ok)'}}>{summary.VENTILATE}</div>
                                            <div className="summary-label">Ventilate</div>
                                        </div>
                                        <div className="summary-card">
                                            <div className="summary-value" style={{color: 'var(--bad)'}}>{summary['NO VENT']}</div>
                                            <div className="summary-label">No Vent</div>
                                        </div>
                                        <div className="summary-card">
                                            <div className="summary-value" style={{color: 'var(--warn)'}}>{summary.CAUTION}</div>
                                            <div className="summary-label">Caution</div>
                                        </div>
                                        <div className="summary-card">
                                            <div className="summary-value" style={{color: 'var(--muted)'}}>{summary.EMPTY}</div>
                                            <div className="summary-label">Empty</div>
                                        </div>
                                    </div>

                                    <div style={{overflowX: 'auto', borderRadius: '16px'}}>
                                        <table>
                                            <thead>
                                                <tr>
                                                    <th>Hold</th><th>Cargo</th><th>Dry °C</th><th>Wet °C</th><th>RH %</th><th>DP °C</th><th>DP Δ</th><th>Decision</th><th>Caution</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {holds.map((hold, idx) => {
                                                    const calc = holdCalculations[idx];
                                                    return (
                                                        <tr key={idx}>
                                                            <td><strong>H{hold.holdNo}</strong></td>
                                                            <td><input type="text" value={hold.cargo} placeholder="Cargo" onChange={(e) => { const n = [...holds]; n[idx].cargo = e.target.value; setHolds(n); }} /></td>
                                                            <td><input type="number" step="0.1" value={hold.dryBulb} onChange={(e) => { const n = [...holds]; n[idx].dryBulb = e.target.value; setHolds(n); }} /></td>
                                                            <td><input type="number" step="0.1" value={hold.wetBulb} onChange={(e) => { const n = [...holds]; n[idx].wetBulb = e.target.value; setHolds(n); }} /></td>
                                                            <td><span className="auto-value">{calc.rh !== null ? calc.rh.toFixed(1) : '-'}</span></td>
                                                            <td><span className="auto-value">{calc.dp !== null ? calc.dp.toFixed(1) : '-'}</span></td>
                                                            <td><span className="auto-value">{calc.dpDelta !== null ? (calc.dpDelta > 0 ? '+' : '') + calc.dpDelta.toFixed(1) : '-'}</span></td>
                                                            <td>
                                                                {calc.decision === 'VENTILATE' && <span className="decision-pill decision-ventilate">VENTILATE</span>}
                                                                {calc.decision === 'NO VENT' && <span className="decision-pill decision-no-vent">NO VENT</span>}
                                                                {calc.decision === '-' && <span style={{color: 'var(--muted)'}}>-</span>}
                                                            </td>
                                                            <td>
                                                                {calc.remark ? (
                                                                    <div style={{fontSize: '11px', color: 'var(--warn)', lineHeight: '1.4'}}>
                                                                        <strong>RH {calc.rh.toFixed(1)}%</strong><br/>
                                                                        High corrosion risk<br/>
                                                                        <span style={{fontSize: '10px', color: 'var(--text-2)'}}>Use dehumidifier if available</span>
                                                                    </div>
                                                                ) : (
                                                                    <span style={{color: 'var(--muted)', fontSize: '11px'}}>OK</span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>

                                    <div className="info-section" style={{marginTop: '32px'}}>
                                        <h3>Understanding the Numbers</h3>
                                        <div className="quick-ref-grid">
                                            <div className="quick-ref-card">
                                                <h4>Relative Humidity (RH)</h4>
                                                <p>Percentage of moisture in air vs. maximum it can hold at that temperature. RH above 60% = high corrosion risk for steel cargo.</p>
                                            </div>
                                            <div className="quick-ref-card">
                                                <h4>Dew Point (DP)</h4>
                                                <p>Temperature where air becomes saturated and water condenses. If a surface is colder than the dew point, moisture will form on it.</p>
                                            </div>
                                            <div className="quick-ref-card">
                                                <h4>DP Delta (DP Δ)</h4>
                                                <p><strong>Hold DP - Outside DP</strong><br/>Positive (+) = Outside air is drier → Safe to ventilate<br/>Negative (-) = Outside air is wetter → Do NOT ventilate</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="info-section">
                                        <h3>Types of Condensation</h3>
                                        <p><strong>Cargo Sweat:</strong> Occurs when warm, humid air contacts cold cargo. The cargo surface cools the air below its dew point, causing condensation directly on the cargo.</p>
                                        <ul style={{marginLeft: '20px', marginTop: '8px', color: 'var(--text-2)', fontSize: '13px', lineHeight: '1.7'}}>
                                            <li>Common when loading cold cargo in warm/humid ports</li>
                                            <li>Happens when sailing from cold to warm climates</li>
                                            <li>Prevention: DO NOT ventilate with warm outside air</li>
                                        </ul>
                                        
                                        <p style={{marginTop: '16px'}}><strong>Ship Sweat:</strong> Occurs when cold outside air enters a warm hold. The cold air contacts warm ship structures (bulkheads, deckhead), cooling them below the dew point. Water condenses on ship surfaces and drips onto cargo.</p>
                                        <ul style={{marginLeft: '20px', marginTop: '8px', color: 'var(--text-2)', fontSize: '13px', lineHeight: '1.7'}}>
                                            <li>Common when sailing from warm to cold climates</li>
                                            <li>Affects ship structures, not cargo directly</li>
                                            <li>Prevention: Limit ventilation in cold weather, use dehumidifier</li>
                                        </ul>
                                    </div>

                                    <div className="info-section">
                                        <h3>Ventilation Decision Rules</h3>
                                        <p><strong style={{color: 'var(--ok)'}}>VENTILATE (Green):</strong> Outside dew point is lower than hold dew point. Introducing outside air will remove moisture from the hold. Safe to open vents.</p>
                                        <p style={{marginTop: '12px'}}><strong style={{color: 'var(--bad)'}}>NO VENT (Red):</strong> Outside dew point is higher than hold dew point. Outside air contains more moisture and will increase humidity inside the hold. Keep vents closed.</p>
                                        <p style={{marginTop: '12px'}}><strong style={{color: 'var(--warn)'}}>CAUTION (Amber):</strong> Relative humidity inside hold exceeds 60%. High corrosion risk for steel cargo. Monitor closely and ventilate aggressively when conditions permit (DP Delta is positive).</p>
                                    </div>

                                    <div className="info-section">
                                        <h3>Using a Dehumidifier</h3>
                                        <p>A dehumidifier mechanically removes moisture from hold air without relying on outside conditions. It works by:</p>
                                        <ul style={{marginLeft: '20px', marginTop: '8px', color: 'var(--text-2)', fontSize: '13px', lineHeight: '1.7'}}>
                                            <li>Drawing air over cold coils (condensing moisture)</li>
                                            <li>Collecting condensed water in a drain tank</li>
                                            <li>Returning drier air to the hold</li>
                                        </ul>
                                        <p style={{marginTop: '12px'}}><strong>When to use:</strong> When outside air is consistently humid, when natural ventilation is insufficient, when RH remains above 60% despite ventilation, or during critical cargo operations.</p>
                                        <p style={{marginTop: '8px'}}><strong>Benefits:</strong> Works 24/7 regardless of weather, precise humidity control, no risk of introducing more moisture, protects cargo in any climate.</p>
                                    </div>

                                    <div className="info-section">
                                        <h3>Best Practices</h3>
                                        <ul style={{marginLeft: '20px', color: 'var(--text-2)', fontSize: '13px', lineHeight: '1.7'}}>
                                            <li><strong>Measure twice daily:</strong> Morning (0800) and evening (2000) readings minimum</li>
                                            <li><strong>Use sling hygrometer:</strong> Measure at hold exhaust, not inlet</li>
                                            <li><strong>Record in log:</strong> Date, time, hold number, dry/wet bulb, DP, RH, decision, weather observations</li>
                                            <li><strong>Ventilate strategically:</strong> Only when DP Delta is positive</li>
                                            <li><strong>Steel cargo threshold:</strong> Maintain RH below 60% to minimize corrosion</li>
                                            <li><strong>Surface ventilation:</strong> Daytime only (0600-1700), good weather only, close at night</li>
                                            <li><strong>Forced ventilation:</strong> Use when surface ventilation insufficient, monitor power consumption</li>
                                            <li><strong>Know your cargo:</strong> Different cargoes have different moisture tolerances</li>
                                        </ul>
                                    </div>

                                    <div className="info-section">
                                        <h3>Legal Protection</h3>
                                        <p>Proper ventilation logs are your legal defense against cargo damage claims. Courts recognize that moisture damage is often unavoidable at sea, but only if the ship's officers demonstrated reasonable care through systematic monitoring and appropriate ventilation decisions. Your log entries prove due diligence.</p>
                                    </div>
                                </div>
                            )}
                            {activeTab === 4 && <UnitTab />}
                            {activeTab === 5 && <HydroTab />}
                            {activeTab === 6 && <DwtTab />}
                        </div>
                    </div>
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'tools-for-mate-v2';
                    const urlsToCache = ['./', 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap', 'https://fonts.cdnfonts.com/css/milanova'];
                    
                    self.addEventListener('install', event => {
                        event.waitUntil(
                            caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
                        );
                    });
                    
                    self.addEventListener('fetch', event => {
                        event.respondWith(
                            caches.match(event.request).then(response => response || fetch(event.request))
                        );
                    });
                `;
                
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(swUrl).then(registration => {
                    console.log('Service Worker registered');
                }).catch(err => {
                    console.log('Service Worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
